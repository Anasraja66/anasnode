version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anaos_postgres
    restart: always
    environment:
      POSTGRES_USER: anaos
      POSTGRES_PASSWORD: anaos_secret
      POSTGRES_DB: anaos_db
    ports:
      - "5433:5432"
    volumes:
      - anaos_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: anaos_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - anaos_redisdata:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: anaos_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@anaos.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  anaos_pgdata:
  anaos_redisdata:
